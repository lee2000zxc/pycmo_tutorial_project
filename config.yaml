reward:
  score_delta_scale: 1.0
  step_penalty: -0.01
  success_bonus: 5.0
  failure_penalty: -100.0

  kill_reward: 100.0
  ownship_loss_penalty: -100.0
  mission_success_reward: 150.0

rl:
  attack_weapon_candidates:
    - 516
    - 51
    - 42

  attack_weapon_quantity: 1
  attack_min_distance_km: 5.0
  attack_max_distance_km: 80.0
  attack_cooldown_steps: 3

  waypoint_step_deg: 0.03
  # 200번째 step 후 truncated=True가 되어 다음 reset에서 시나리오 자동 로드
  max_episode_steps: 200
  target_success_distance_km: 0.0
  max_target_distance_km: 300.0

  distance_progress_scale: 1.0

  contact_acquired_reward: 0.5
  contact_maintain_reward: 0.01
  no_contact_penalty: -0.05

  heading_alignment_scale: 0.01

  preferred_attack_min_km: 25.0
  preferred_attack_max_km: 60.0
  preferred_range_reward: 0.1

  too_close_distance_km: 10.0
  too_close_penalty: -0.2

  valid_attack_reward: 0.5
  invalid_attack_penalty: -0.2
  attack_request_cost: -0.02

  fuel_penalty_scale: 1.0
  action_change_penalty: -0.002

  reward_clip_min: -200.0
  reward_clip_max: 200.0

  auto_launch: true
  soft_reset: true
