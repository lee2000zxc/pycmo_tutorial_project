[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pycmo-tutorial3"
version = "0.1.0"
description = "CMO Steam file-protocol starter environment"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0,<7",
  "psutil>=5.9,<8",
  "numpy>=1.24,<3",
]

[tool.setuptools.packages.find]
include = ["cmo_tutorial*"]
